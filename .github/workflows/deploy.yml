name: deploy

# 这是唯一部署实现：所有消费仓的部署只允许写一个 caller workflow 调用本文件，
# 不得再在各自仓里复制部署步骤。手工兜底（GitHub 不可用时）见各仓 DEPLOY.md，
# 命令里的值从 caller 的 inputs 里抄。
# 服务器地址、SSH 密钥一律经 inputs / secrets 传入，本文件不写死任何主机或凭据。
# mode=releases：rsync 进 releases/<id>/ → 按 link_paths 建持久化软链（配了才做）→ 切 dist 软链 → 重启 → 保留最近 N 份；
# mode=inplace：原地覆盖（给不能换目录的服务用，快照进 .deploy-history 供回滚）。
# 健康检查有两种 health_check 模式：http 在 runner 上探 health_url（写对外地址，如 http://<host>:9928/）；
# ssh 上服务器探本地端口——对外入口可能只收 HTTPS / 自签证书，runner 侧 curl 探不通，探本地端口更可靠
# （此时 health_url 写服务器本地地址，如 http://127.0.0.1:9929/）。
# health_check 验服务本身，public_health_url 验对外链路（Caddy/证书），两者互补：
# Caddy 分流配错时 health_check 照样通过，只有从外部探对外地址才能发现。
on:
  workflow_call:
    inputs:
      service:
        description: '服务器 systemd 服务名，如 serve-9928'
        required: true
        type: string
      remote_dir:
        description: '服务器上的部署根目录，如 /root/project/agent-mobile/agent-mobile-app'
        required: true
        type: string
      work_dir:
        description: '仓内构建目录，如 agent-mobile-app'
        required: true
        type: string
      artifact_dir:
        description: '产物目录，相对 work_dir，默认 dist'
        required: false
        type: string
        default: 'dist'
      quality_cmd:
        description: '质量门禁命令，在 work_dir 里执行；非 Expo 仓传自己的类型检查 + 测试组合'
        required: false
        type: string
        default: 'pnpm exec tsc --noEmit && pnpm test'
      build_cmd:
        description: '构建命令，在 work_dir 里执行'
        required: false
        type: string
        default: 'pnpm exec expo export --platform web --clear'
      assemble:
        description: '产物组装方式：static-dir 直接用构建产物目录；node-standalone 把 Next standalone 组装成 release 目录'
        required: false
        type: string
        default: 'static-dir'
      link_paths:
        description: '持久化路径软链：逗号分隔的「相对路径=目标」对（如 data=../../data），release 就绪后切 dist 之前逐对建软链；留空不建'
        required: false
        type: string
        default: ''
      health_url:
        description: '健康检查 URL，必须返回 200'
        required: true
        type: string
      health_check:
        description: '健康检查模式：http 在 runner 上探 health_url；ssh 上服务器探本地端口'
        required: false
        type: string
        default: 'http'
      public_health_url:
        description: '对外链路健康检查 URL（Caddy/证书），必须返回 200；留空则不做这一项'
        required: false
        type: string
        default: ''
      public_health_insecure:
        description: '对外链路允许自签证书（curl -k）；换正式证书的仓传 false'
        required: false
        type: boolean
        default: true
      keep_releases:
        description: '保留的 release / 快照数量'
        required: false
        type: number
        default: 5
      dry_run:
        description: '只打印将要执行的命令，不碰服务器'
        required: false
        type: boolean
        default: false
      node_version:
        description: 'Node 版本'
        required: false
        type: string
        default: '24.21.0'
      mode:
        description: '部署模式：releases（切软链）或 inplace（原地覆盖）'
        required: false
        type: string
        default: 'releases'
      ssh_host:
        description: 'SSH 目标主机；留空则从 health_url 解析'
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # workflow_call 的 input 不支持 choice 类型，取值在这里兜底校验
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          HEALTH_CHECK: ${{ inputs.health_check }}
          ASSEMBLE: ${{ inputs.assemble }}
        run: |
          case "$MODE" in
            releases|inplace) ;;
            *) echo "::error::mode 只能是 releases 或 inplace，当前: $MODE"; exit 1 ;;
          esac
          case "$HEALTH_CHECK" in
            http|ssh) ;;
            *) echo "::error::health_check 只能是 http 或 ssh，当前: $HEALTH_CHECK"; exit 2 ;;
          esac
          case "$ASSEMBLE" in
            static-dir|node-standalone) ;;
            *) echo "::error::assemble 只能是 static-dir 或 node-standalone，当前: $ASSEMBLE"; exit 1 ;;
          esac

      # pnpm 必须在 setup-node 之前：setup-node 的 cache: pnpm 要先跑 `pnpm store path`
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.work_dir }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.work_dir }}
        run: pnpm install --frozen-lockfile

      # 两步命令都从 inputs 来（缺省值 = 原先写死的 Expo 仓命令），老 caller 零改动
      - name: Quality gates
        working-directory: ${{ inputs.work_dir }}
        run: ${{ inputs.quality_cmd }}

      - name: Build
        working-directory: ${{ inputs.work_dir }}
        run: ${{ inputs.build_cmd }}

      # assemble=node-standalone：把 Next 的 standalone 产物组装成一个能直接 rsync 的 release 目录。
      # 目录结构以 homebase 实测为准——standalone 自带仓根前缀，release 里 packages/web/ 与 scripts/ 同级；
      # static 与 public 不在 standalone 里，按 standalone 自带的前缀补到同一位置。
      # 只搬产物：不建 data 软链——需要外置状态时由 link_paths 在切软链前创建（见 Link persistent paths）。
      - name: Assemble release (node-standalone)
        if: ${{ inputs.assemble == 'node-standalone' }}
        env:
          WORK_DIR: ${{ inputs.work_dir }}
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        run: |
          set -euo pipefail
          # head 会提前关管道让 find 退 141，|| true 兜住，避免 pipefail 把脚本带崩
          standalone="$(find "${WORK_DIR}" -type d -path '*/.next/standalone' -not -path '*/node_modules/*' | head -n 1 || true)"
          if [ -z "${standalone}" ]; then
            echo "::error::${WORK_DIR} 下没有 .next/standalone（build_cmd 需要产出 output: 'standalone'）"
            exit 1
          fi
          app_dir="${standalone%/.next/standalone}"
          # 应用前缀 = standalone 里 .next/server 所在目录相对 standalone 根的路径（homebase 实测为 packages/web）
          server_dir="$(cd "${standalone}" && find . -type d -path '*/.next/server' -not -path '*/node_modules/*' | head -n 1 || true)"
          if [ -z "${server_dir}" ]; then
            echo "::error::${standalone} 里没有 .next/server"
            exit 1
          fi
          prefix="${server_dir#./}"
          prefix="${prefix%/.next/server}"
          prefix="${prefix%.next/server}"
          if [ -z "${prefix}" ]; then prefix="."; fi

          release="${WORK_DIR}/${ARTIFACT_DIR}"
          case "${release}" in
            "${standalone}"*) echo "::error::artifact_dir 不能落在 standalone 目录内: ${release}"; exit 1 ;;
          esac
          mkdir -p "${release}"

          # 1) standalone 整棵落到 release 根
          cp -a "${standalone}/." "${release}/"
          # 2) .next/static（standalone 不带 static，缺了页面全 404）
          mkdir -p "${release}/${prefix}/.next"
          cp -a "${app_dir}/.next/static" "${release}/${prefix}/.next/static"
          # 3) public（homebase 没有 public/，缺就跳过）
          if [ -d "${app_dir}/public" ]; then
            mkdir -p "${release}/${prefix}"
            cp -a "${app_dir}/public" "${release}/${prefix}/public"
          else
            echo "应用目录没有 public/，跳过"
          fi
          # 4) 仓根 scripts/ 整份并进 release（standalone 只带被 trace 到的那几个脚本）
          if [ -d "scripts" ]; then
            mkdir -p "${release}/scripts"
            cp -a scripts/. "${release}/scripts/"
          else
            echo "仓根没有 scripts/，跳过"
          fi
          echo "release 组装完成: ${release}（应用前缀 ${prefix}）"
          # 只是给人看的摘要：head 提前退出会让上游 sort 收到 SIGPIPE（141），
          # 在 set -euo pipefail 下会把「已组装完成」的步骤整步判失败，故兜底。
          find "${release}" -maxdepth 2 -not -path '*/node_modules*' | sort | head -n 40 || true

      # 部署目标：主机优先取 ssh_host，留空才从 health_url 解析；release id 用本次 run 的编号
      - name: Resolve deploy target
        id: target
        env:
          SSH_HOST: ${{ inputs.ssh_host }}
          HEALTH_URL: ${{ inputs.health_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          HOST="$SSH_HOST"
          if [ -z "$HOST" ]; then
            HOST=$(printf '%s' "$HEALTH_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##; s#^[^/@]*@##; s#[:/].*$##')
          fi
          if [ -z "$HOST" ]; then echo "::error::无法解析 SSH 主机（ssh_host 为空且 health_url 里取不到）"; exit 1; fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "release=gh-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Print deploy plan (dry run)
        if: ${{ inputs.dry_run }}
        env:
          MODE: ${{ inputs.mode }}
          SERVICE: ${{ inputs.service }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          WORK_DIR: ${{ inputs.work_dir }}
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
          HEALTH_URL: ${{ inputs.health_url }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
          LINK_PATHS: ${{ inputs.link_paths }}
          HOST: ${{ steps.target.outputs.host }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${HOST}"
          echo "=== dry_run=true，以下命令本次不会执行 ==="
          if [ "$MODE" = "inplace" ]; then
            echo "${SSH} \"if [ -d ${REMOTE_DIR} ]; then mkdir -p ${REMOTE_DIR}/.deploy-history && tar -czf ${REMOTE_DIR}/.deploy-history/${RELEASE}-prev.tar.gz --exclude=node_modules --exclude=./node_modules --exclude=.deploy-history --exclude=./.deploy-history -C ${REMOTE_DIR} .; else mkdir -p ${REMOTE_DIR}/.deploy-history; fi\""
            echo "rsync -az --delete --exclude=.deploy-history ${WORK_DIR}/${ARTIFACT_DIR}/ root@${HOST}:${REMOTE_DIR}/"
            echo "${SSH} \"cd ${REMOTE_DIR} && systemctl daemon-reload && systemctl restart ${SERVICE}\""
            echo "${SSH} \"cd ${REMOTE_DIR}/.deploy-history && ls -1t *.tar.gz 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf\""
          else
            echo "rsync -az --delete ${WORK_DIR}/${ARTIFACT_DIR}/ root@${HOST}:${REMOTE_DIR}/releases/${RELEASE}/"
            if [ -n "$LINK_PATHS" ]; then
              echo "# 切 dist 软链之前，逐条建持久化路径软链（先断言不越出 release，再 rm -f 旧链后重建）:"
              IFS=',' read -ra pairs <<< "$LINK_PATHS"
              for pair in "${pairs[@]}"; do
                pair="${pair#"${pair%%[![:space:]]*}"}"
                pair="${pair%"${pair##*[![:space:]]}"}"
                if [ -n "$pair" ]; then
                  echo "${SSH} \"cd ${REMOTE_DIR} && mkdir -p \$(dirname releases/${RELEASE}/${pair%%=*}) && rm -f releases/${RELEASE}/${pair%%=*} && ln -s ${pair#*=} releases/${RELEASE}/${pair%%=*}\""
                fi
              done
            fi
            echo "${SSH} \"cd ${REMOTE_DIR} && ln -sfn releases/${RELEASE} dist && systemctl restart ${SERVICE}\""
            echo "${SSH} \"cd ${REMOTE_DIR} && ls -1dt releases/*/ | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf\""
          fi
          echo "curl -sS -m 8 -o /dev/null -w '%{http_code}' ${HEALTH_URL}"
          echo "若配置了 public_health_url，会在 Health check 之后额外探一次对外链路（Caddy/证书），非 200 即失败"

      - name: Setup deploy key
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ---- mode=releases ----
      - name: Upload release
        if: ${{ !inputs.dry_run && inputs.mode == 'releases' }}
        env:
          WORK_DIR: ${{ inputs.work_dir }}
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          HOST: ${{ steps.target.outputs.host }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "${WORK_DIR}/${ARTIFACT_DIR}/" "root@${HOST}:${REMOTE_DIR}/releases/${RELEASE}/"

      # release 是不可变产物，但数据库 / 上传等状态必须外置：按 link_paths 在 release 内
      # 建持久化路径软链（如 data -> ../../data）。必须在切 dist 软链之前完成——
      # homebase 代码按 cwd/../../data 找库（cwd=dist/packages/web → releases/<id>/data），
      # 软链没就位，服务一启动就因缺 data 目录崩溃。
      - name: Link persistent paths
        if: ${{ !inputs.dry_run && inputs.mode == 'releases' && inputs.link_paths != '' }}
        env:
          LINK_PATHS: ${{ inputs.link_paths }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          HOST: ${{ steps.target.outputs.host }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: |
          set -euo pipefail
          # 渲染格式是「逗号+空格」分隔的「相对路径=目标」对；先整段校验再上服务器，
          # 某项不含 = 或等号两侧为空一律 ::error:: 退 1，不带着畸形配置去动 release
          IFS=',' read -ra pairs <<< "${LINK_PATHS}"
          links=()
          for pair in "${pairs[@]}"; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            case "${pair}" in
              *=*) ;;
              *) echo "::error::link_paths 每项必须是「相对路径=目标」，缺 '=' 的项: ${pair}"; exit 1 ;;
            esac
            rel="${pair%%=*}"
            target="${pair#*=}"
            rel="${rel%"${rel##*[![:space:]]}"}"
            target="${target#"${target%%[![:space:]]*}"}"
            target="${target%"${target##*[![:space:]]}"}"
            if [ -z "${rel}" ] || [ -z "${target}" ]; then
              echo "::error::link_paths 等号两侧不能为空（相对路径与目标都要给）: ${pair}"
              exit 1
            fi
            # rel 会拼进远端 rm -rf 的路径里，任其含 .. / 绝对化 / 逗号就能越出 release
            case "${rel}" in
              /*) echo "::error::link_paths 的路径必须是相对路径: ${rel}"; exit 1 ;;
              *..*) case "/${rel}/" in */../*) echo "::error::link_paths 的路径不许含 '..'（会逃出 release 目录）: ${rel}"; exit 1 ;; esac ;;
            esac
            case "${rel}" in
              *,*) echo "::error::link_paths 的路径不许含 ','（分隔符）: ${rel}"; exit 1 ;;
            esac
            links+=("${rel}=${target}")
          done
          # 校验全过才开始动服务器：逐对 mkdir 父目录 → 清掉同名残留 → 建软链
          for item in "${links[@]}"; do
            rel="${item%%=*}"
            target="${item#*=}"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" \
              "set -e; cd ${REMOTE_DIR} \
                && base=\$(realpath -m \"releases/${RELEASE}\") \
                && rdir=\$(dirname \"${rel}\") && rname=\$(basename \"${rel}\") \
                && full=\"\$(realpath -m \"releases/${RELEASE}/\${rdir}\")/\${rname}\" \
                && case \"\${full}\" in \"\${base}\"/*) ;; *) echo \"越界: \${full} 不在 \${base} 内\" >&2; exit 1 ;; esac \
                && mkdir -p \"\$(dirname \"\${full}\")\" \
                && rm -f \"\${full}\" && ln -s \"${target}\" \"\${full}\""
            echo "linked: releases/${RELEASE}/${rel} -> ${target}"
          done

      - name: Flip symlink and restart
        if: ${{ !inputs.dry_run && inputs.mode == 'releases' }}
        env:
          SERVICE: ${{ inputs.service }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          HOST: ${{ steps.target.outputs.host }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "cd ${REMOTE_DIR} && ln -sfn releases/${RELEASE} dist && systemctl restart ${SERVICE}"

      - name: Cleanup old releases
        if: ${{ !inputs.dry_run && inputs.mode == 'releases' }}
        env:
          REMOTE_DIR: ${{ inputs.remote_dir }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "cd ${REMOTE_DIR} && ls -1dt releases/*/ | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf"

      # ---- mode=inplace：不建 releases 目录、不切软链 ----
      - name: Snapshot current deployment
        if: ${{ !inputs.dry_run && inputs.mode == 'inplace' }}
        env:
          REMOTE_DIR: ${{ inputs.remote_dir }}
          HOST: ${{ steps.target.outputs.host }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "if [ -d ${REMOTE_DIR} ]; then mkdir -p ${REMOTE_DIR}/.deploy-history && tar -czf ${REMOTE_DIR}/.deploy-history/${RELEASE}-prev.tar.gz --exclude=node_modules --exclude=./node_modules --exclude=.deploy-history --exclude=./.deploy-history -C ${REMOTE_DIR} .; else mkdir -p ${REMOTE_DIR}/.deploy-history; fi"

      - name: Upload in place
        if: ${{ !inputs.dry_run && inputs.mode == 'inplace' }}
        env:
          WORK_DIR: ${{ inputs.work_dir }}
          ARTIFACT_DIR: ${{ inputs.artifact_dir }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          rsync -az --delete --exclude=.deploy-history -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            "${WORK_DIR}/${ARTIFACT_DIR}/" "root@${HOST}:${REMOTE_DIR}/"

      - name: Restart service (inplace)
        if: ${{ !inputs.dry_run && inputs.mode == 'inplace' }}
        env:
          SERVICE: ${{ inputs.service }}
          REMOTE_DIR: ${{ inputs.remote_dir }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "cd ${REMOTE_DIR} && systemctl daemon-reload && systemctl restart ${SERVICE}"

      # ---- 两种 mode 共用：健康检查必须 200 ----
      # health_check=http 在 runner 上探；health_check=ssh 上服务器探本地端口。
      # ssh 模式排在 Setup deploy key 之后（key 步骤必须先写好），sleep 2 也保留在分叉之前——
      # 别把 sleep 2 和 key 步骤的顺序弄反。
      - name: Health check
        if: ${{ !inputs.dry_run }}
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          HEALTH_CHECK: ${{ inputs.health_check }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          sleep 2
          if [ "$HEALTH_CHECK" = "ssh" ]; then
            CODE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" "curl -sS -m 8 -o /dev/null -w '%{http_code}' ${HEALTH_URL}") || CODE=000
          else
            CODE=$(curl -sS -m 8 -o /dev/null -w '%{http_code}' "$HEALTH_URL")
          fi
          echo "health -> $CODE"
          if [ "$CODE" != "200" ]; then echo "::error::健康检查失败: $CODE"; exit 1; fi

      # 验对外链路（Caddy 分流 / 证书）：health_check 只验服务本身，这一步互补。
      # -k 仅在 public_health_insecure=true（自签证书）时加，参数用变量拼，不写重复命令。
      - name: Public health check
        if: ${{ !inputs.dry_run && inputs.public_health_url != '' }}
        env:
          PUBLIC_HEALTH_URL: ${{ inputs.public_health_url }}
          PUBLIC_HEALTH_INSECURE: ${{ inputs.public_health_insecure }}
        run: |
          CURL_OPTS=(-sS -m 10 -o /dev/null -w '%{http_code}')
          if [ "$PUBLIC_HEALTH_INSECURE" = "true" ]; then
            CURL_OPTS+=(-k)
          fi
          CODE=$(curl "${CURL_OPTS[@]}" "$PUBLIC_HEALTH_URL") || CODE=000
          echo "public health -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::对外链路健康检查失败: $CODE（URL: $PUBLIC_HEALTH_URL）"
            exit 1
          fi

      - name: Cleanup deploy history
        if: ${{ !inputs.dry_run && inputs.mode == 'inplace' }}
        env:
          REMOTE_DIR: ${{ inputs.remote_dir }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@${HOST}" \
            "cd ${REMOTE_DIR}/.deploy-history && ls -1t *.tar.gz 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf"

# mode=inplace 的回滚：把上一份快照解回 <remote_dir> 再重启，不是切 dist 软链
#   ssh root@<host> "tar -xzf <remote_dir>/.deploy-history/<上一份>-prev.tar.gz -C <remote_dir> && systemctl restart <service>"
# （该服务的依赖提升在仓根 node_modules，切目录会让依赖解析断掉）
